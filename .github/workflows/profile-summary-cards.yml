# Generates GitHub stats cards as static SVGs.
# Commits to `main` inside profile-summary-card-output/<theme>/

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: rajit2004
          BRANCH_NAME: "main"
          UTC_OFFSET: 5.5
