# .github/workflows/update_prs.yml
# Place in: rajit2004/rajit2004/.github/workflows/update_prs.yml
#
# Fetches all merged PRs on external repos and updates
# the Open Source Contributions section in profile README.

name: Update Open Source Contributions

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:          # manual trigger

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run PR tracker
        run: python .github/scripts/update_prs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "🤝 Auto-update open source contributions"
          git push
